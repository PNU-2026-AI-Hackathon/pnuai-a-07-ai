# 로컬 실행 기본값은 그대로 두고, Docker 등 다른 환경에서는 환경변수로 덮어쓴다.
# (SPRING_DATASOURCE_URL, JWT_SECRET, APP_REPORT_STORAGE_DIR ...)
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ai_safework}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect


jwt:
  # 기본값을 두지 않는다. 이 저장소는 공개되어 있고, 서명 키는 대칭키다.
  # 기본값을 적어 두면 그걸 읽은 사람이 아무 사용자로든 토큰을 위조할 수 있다.
  # 없으면 기동에 실패하는 편이, 모르는 키로 도는 것보다 낫다.
  # (start-demo.ps1 이 .env 에 키를 만들어 두므로 로컬 실행은 그대로 된다)
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}

app:
  llm:
    # 답변 생성(LLM). 키가 없으면 챗봇이 조문만 돌려주고, 검색 기능은 그대로 동작한다.
    # 키는 설정 파일에 적지 말고 환경변수로 넣을 것.
    api-key: ${GEMINI_API_KEY:}
    # 모델별 하루 무료 호출 수가 다르다. 고르는 기준은 LlmProperties 주석 참고.
    # (여기 값이 LlmProperties 의 필드 기본값을 덮으므로 바꿀 때 양쪽을 같이 볼 것)
    model: ${APP_LLM_MODEL:gemini-flash-lite-latest}
  cors:
    # 프론트를 백엔드와 다른 주소에 올리면 이 목록에 있어야 브라우저가 요청을 허용한다.
    # 배포 주소가 정해지면 환경변수로 넣는다(코드 수정 불필요).
    #   APP_CORS_ALLOWED_ORIGINS=https://주소1,https://주소2
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://pnu-2026-ai-hackathon.github.io,https://*.trycloudflare.com,https://*.ngrok-free.dev,https://*.ngrok-free.app}
  ml:
    # ML 서버(FastAPI). 꺼져 있어도 백엔드는 폴백으로 동작한다.
    base-url: ${APP_ML_BASE_URL:http://localhost:8000}
    enabled: ${APP_ML_ENABLED:true}
    # 위험유형 예측이 SHAP 계산 때문에 20초쯤 걸린다(MlServerProperties 주석 참고).
    read-timeout: ${APP_ML_READ_TIMEOUT:30s}
  report:
    # 생성된 PDF 저장 위치 (상대경로면 프로세스 실행 디렉터리 기준)
    storage-dir: ${APP_REPORT_STORAGE_DIR:reports}
    font:
      # 나눔고딕(OFL 1.1)을 JAR 에 번들해 두었으므로 별도 설정 없이
      # Windows/Linux/Docker 어디서든 한글이 동일하게 렌더링된다.
      # 시스템 폰트를 쓰려면 regular-path / bold-path 에 파일 경로를 지정하면 된다.
      family: ReportKorean

server:
  port: 8080

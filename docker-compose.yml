services:
  postgres:
    image: postgres:18
    container_name: safework-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      POSTGRES_DB: ai_safework
      # 초기화 스크립트가 psql 을 인자 없이 호출해도 되도록
      PGPASSWORD: ${POSTGRES_PASSWORD:-1234}
    ports:
      - "5432:5432"
    volumes:
      # postgres:18 부터는 /var/lib/postgresql 아래에 버전별 디렉터리를 두므로
      # 예전처럼 .../data 에 붙이면 기동에 실패한다.
      - safework-pgdata:/var/lib/postgresql
      # 컨테이너를 처음 만들 때만 실행된다. 다시 적재하려면 볼륨을 지워야 한다.
      #   docker compose down -v && docker compose up -d
      - ./database/docker/init:/docker-entrypoint-initdb.d:ro
      # SQL 은 /sql 아래로 따로 붙인다. initdb.d 하위에 겹쳐 마운트하면
      # 읽기전용 마운트 안에 마운트포인트를 못 만들어 컨테이너가 뜨지 않는다.
      - ./database/schema:/sql/schema:ro
      - ./데이터모델링/DB개선/output:/sql/data:ro
      # 용량이 커서 git 에 없는 기초 덤프. 있으면 적재하고 없으면 건너뛴다.
      - ./database/dump:/sql/dump:ro
    healthcheck:
      # -h 127.0.0.1 이 중요하다. 초기화 스크립트를 도는 동안 Postgres 는 TCP 를 열지 않고
      # 로컬 소켓만 사용하므로, 소켓으로 검사하면 적재가 끝나기도 전에 healthy 로 판정되어
      # 백엔드가 먼저 떠서 연결 실패로 죽는다.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d ai_safework"]
      interval: 5s
      timeout: 5s
      # 덤프 적재에 수 분이 걸린다(사고 64만건).
      retries: 120
      start_period: 30s

  backend:
    build:
      context: ./backend
    container_name: safework-backend
    # 혹시 DB 준비 전에 떠서 죽더라도 스스로 다시 붙도록 한다.
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # 컨테이너 안에서는 localhost 가 아니라 서비스명으로 붙는다.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ai_safework
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      JWT_SECRET: ${JWT_SECRET:-c2FmZXdvcmthaXNlY3JldGtleWZvcmp3dHRva2VuZ2VuZXJhdGlvbjIwMjY=}
      APP_REPORT_STORAGE_DIR: /app/reports
    ports:
      - "8080:8080"
    volumes:
      - safework-reports:/app/reports

volumes:
  safework-pgdata:
  safework-reports:
